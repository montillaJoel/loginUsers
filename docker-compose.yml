# Opcional: levanta MySQL en Docker con la base de datos ya creada.
# Usa la clave de loginUsers_DB_CLAVE del archivo .env.
# Comando: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: loginusers-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${loginUsers_DB_CLAVE}
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schemas.sql:/docker-entrypoint-initdb.d/schemas.sql:ro
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
